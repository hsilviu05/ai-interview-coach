name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore backend test project
        run: dotnet restore backend/AIInterviewCoach.Tests/AIInterviewCoach.Tests.csproj

      - name: Run backend test suite with coverage
        run: |
          dotnet test backend/AIInterviewCoach.Tests/AIInterviewCoach.Tests.csproj \
            --configuration Release --no-restore \
            --settings backend/coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory backend/coverage-results

      - name: Enforce backend coverage thresholds
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, glob, sys
          files = glob.glob('backend/coverage-results/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('ERROR: coverage file not found', file=sys.stderr)
              sys.exit(1)
          root = ET.parse(files[0]).getroot()
          line   = float(root.attrib['line-rate'])
          branch = float(root.attrib['branch-rate'])
          thresholds = [('line', line, 0.80), ('branch', branch, 0.50)]
          failed = False
          for name, value, minimum in thresholds:
              status = 'PASS' if value >= minimum else 'FAIL'
              print(f'{status}  {name:8s}  {value*100:.1f}%  (min {minimum*100:.0f}%)')
              if value < minimum:
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check application code
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type-check test code
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Run frontend unit tests with coverage
        run: npx ng test --watch=false --coverage

      - name: Enforce frontend coverage thresholds
        run: |
          python3 - <<'EOF'
          import json, sys
          with open('coverage/frontend/coverage-summary.json') as f:
              d = json.load(f)
          t = d['total']
          thresholds = [
              ('statements', t['statements']['pct'], 55),
              ('branches',   t['branches']['pct'],   43),
              ('functions',  t['functions']['pct'],   38),
              ('lines',      t['lines']['pct'],       57),
          ]
          failed = False
          for name, pct, minimum in thresholds:
              status = 'PASS' if pct >= minimum else 'FAIL'
              print(f'{status}  {name:12s}  {pct:.1f}%  (min {minimum}%)')
              if pct < minimum:
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Build production frontend bundle
        run: npm run build

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-tests
      - frontend-checks
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend API project
        run: dotnet restore backend/AIInterviewCoach.API/AIInterviewCoach.API.csproj

      - name: Build backend API project
        run: dotnet build backend/AIInterviewCoach.API/AIInterviewCoach.API.csproj --no-restore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
