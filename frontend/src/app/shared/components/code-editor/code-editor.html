<div class="editor-shell" [style.height.px]="height">
  <div #editorHost class="editor-host" *ngIf="!useTextareaFallback(); else fallbackEditor"></div>

  <ng-template #fallbackEditor>
    <textarea
      class="editor-fallback"
      [disabled]="isDisabled()"
      [value]="value()"
      spellcheck="false"
      (blur)="handleBlur()"
      (keydown)="handleFallbackKeydown($event)"
      (input)="handleFallbackInput($event)"></textarea>
  </ng-template>
</div>
